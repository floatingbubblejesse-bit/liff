<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金鶯診所 - 醫師個人班表</title>
<link rel="preconnect" href="https://www.drking.com.tw">
<style>
  /* 金鶯診所官網色票（取自 drking.com.tw 主視覺） */
  :root {
    --primary-dark: #007d78;
    --primary: #00b0a6;
    --primary-soft: #57c2c3;
    --primary-light: #d5efef;
    --accent: #fbaf1e;
    --text: #4a4a4a;
    --text-strong: #000;
    --border: #e1e1e1;
    --bg: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", PMingLiU, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }

  /* Header / Logo */
  .top-bar {
    background: #fff;
    border-bottom: 3px solid var(--primary);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .top-bar img {
    height: 44px; width: auto; display: block;
  }

  /* 頁面標題（仿 .producttitle） */
  .page-title-bar {
    background: var(--primary-light);
    padding: 18px 16px;
    border-bottom: 1px solid var(--border);
  }
  .page-title {
    color: var(--primary-dark);
    font-weight: bold;
    font-size: 22px;
    line-height: 1.3;
    margin: 0;
    text-align: center;
    letter-spacing: 1px;
  }
  .page-title::before {
    content: "";
    display: inline-block;
    width: 24px; height: 3px;
    background: var(--primary);
    vertical-align: middle;
    margin-right: 10px;
  }
  .page-title::after {
    content: "";
    display: inline-block;
    width: 24px; height: 3px;
    background: var(--primary);
    vertical-align: middle;
    margin-left: 10px;
  }
  .page-sub {
    margin: 6px 0 0;
    font-size: 13px;
    color: var(--primary-dark);
    text-align: center;
    opacity: 0.85;
  }

  /* 院區 tabs（仿 .link_btn 按鈕風格） */
  .tabs {
    position: sticky; top: 0; z-index: 50;
    background: #fff;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs-inner { display: inline-flex; padding: 10px 12px; gap: 6px; }
  .tab {
    flex: 0 0 auto;
    padding: 8px 16px;
    font-size: 14px;
    color: var(--primary-dark);
    background: #fff;
    border: 1px solid var(--primary-soft);
    border-radius: 22px;
    transition: all 0.18s;
  }
  .tab.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    font-weight: 500;
  }

  /* 院區區塊 */
  .clinic {
    padding: 22px 14px 6px;
    scroll-margin-top: 60px;
  }
  .clinic-head {
    display: flex; align-items: center; gap: 10px;
    border-bottom: 2px solid var(--primary-light);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .clinic-icon {
    width: 6px; height: 22px;
    background: var(--primary);
    border-radius: 1px;
  }
  .clinic-name {
    margin: 0;
    font-size: 19px;
    font-weight: bold;
    color: var(--primary-dark);
    letter-spacing: 1px;
  }
  .clinic-count {
    margin-left: auto;
    font-size: 12px;
    color: #fff;
    background: var(--primary-soft);
    padding: 3px 10px;
    border-radius: 10px;
    font-weight: 400;
  }

  /* 醫師卡片網格（仿 .col-xs-6 col-md-3） */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 10px;
    text-align: center;
    transition: all 0.18s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 70px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--primary-soft);
    transform: scaleX(0);
    transition: transform 0.2s;
  }
  .card:active {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .card:active::before {
    transform: scaleX(1);
    background: var(--primary);
  }
  .title-tag {
    display: inline-block;
    font-size: 11px;
    color: #fff;
    background: var(--accent);
    padding: 1px 8px;
    border-radius: 8px;
    margin-bottom: 6px;
    font-weight: 400;
    letter-spacing: 0.5px;
  }
  .doctor-name {
    font-size: 16px;
    line-height: 1.3;
    color: var(--text-strong);
    font-weight: 500;
    word-break: keep-all;
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    padding: 22px 16px 30px;
    background: var(--primary-dark);
    color: #fff;
    text-align: center;
    font-size: 12px;
    line-height: 1.7;
  }
  .footer a {
    color: var(--primary-light);
    text-decoration: underline;
  }
  .schedule-btn {
    display: inline-block;
    margin: 0 0 14px;
    padding: 10px 26px;
    background: var(--primary);
    color: #fff !important;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none !important;
    letter-spacing: 1px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .footer .brand {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: 1px;
  }
  .footer .divider {
    width: 36px; height: 2px;
    background: var(--primary-soft);
    margin: 8px auto;
  }
</style>
</head>

const main = document.getElementById("main");

    <div class="clinic-head">
      <div class="clinic-icon"></div>
      <h2 class="clinic-name">${c.name}</h2>

    <div class="grid">

        <a class="card" href="${SITE}${d.url}" data-url="${SITE}${d.url}">
          ${d.title ? `<span class="title-tag">${d.title}</span>` : ""}
          <div class="doctor-name">${d.name}</div>

      `).join("")}
    </div>
  </section>
`).join("");

// 點擊醫師卡片：在 LIFF 內用外部瀏覽器開啟
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", (e) => {
    e.preventDefault();
    const url = card.dataset.url;
    if (window.liff && liff.isInClient && liff.isInClient()) {
      liff.openWindow({ url, external: true });
    } else {
      window.open(url, "_blank");
    }
  });
});

// tabs 高亮
const tabEls = [...document.querySelectorAll(".tab")];
const setActive = (id) => {
  tabEls.forEach(t => t.classList.toggle("active", t.dataset.id === id));
  const active = tabEls.find(t => t.dataset.id === id);
  if (active) active.scrollIntoView({ behavior:"smooth", block:"nearest", inline:"center" });
};
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
}, { rootMargin: "-60px 0px -65% 0px", threshold: 0 });
document.querySelectorAll(".clinic").forEach(s => io.observe(s));
setActive(CLINICS[0].id);

// tabs 平滑滾動
tabEls.forEach(t => {
  t.addEventListener("click", e => {
    e.preventDefault();
    const target = document.getElementById(t.dataset.id);
    if (target) {
      const y = target.getBoundingClientRect().top + window.pageYOffset - 55;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  });
});
