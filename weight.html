<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金鶯減重開藥系統</title>
<style>
:root{
  --bg:#F5F3F0; --card:#FFFFFF; --ink:#4A4A48; --sub:#8C8A85;
  --sage:#8FA98F; --sage-dark:#6E8B6E; --sage-bg:#EEF3EE;
  --sand:#C9A87C; --sand-bg:#F7F0E5;
  --rose:#C08B8B; --rose-bg:#F6ECEC;
  --blue:#8FA3B8; --blue-bg:#ECF1F5;
  --line:#E5E1DB;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
body{background:var(--bg);color:var(--ink);padding:16px}
.wrap{max-width:1150px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header h1{font-size:20px;font-weight:700}
header .ver{font-size:12px;color:var(--sub);flex:1}
.gear{font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;color:var(--sage-dark);margin-bottom:10px;letter-spacing:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#FAFAF8;font-size:14px;cursor:pointer;user-select:none;transition:.15s;touch-action:manipulation}
.lt,.tgl,.rxdel,button{touch-action:manipulation}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.sev{background:var(--rose);border-color:var(--rose);color:#fff}
.sevhint{font-weight:400;font-size:12px;color:var(--sub);margin-left:8px;letter-spacing:0}
.sevhint .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:2px}
.sevhint .dot.g{background:var(--sage)}
.sevhint .dot.r{background:var(--rose)}
.ptbar{background:var(--blue-bg);border:1px solid #DCE4EB;color:#5A6E80;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:700;margin-bottom:14px}
.sym-row{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.sym-left{flex:2 1 400px}
.fu-side{flex:1 1 220px;min-width:200px;display:flex;flex-direction:column}
.symgroup{margin-bottom:10px}
.symgroup .gt{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px}
.fu-side .fu-block:first-child{border-top:none;margin-top:0;padding-top:0}
@media(max-width:760px){.sym-left{flex:1 1 100%}}
.fu-block{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.fu-block .fu-title{font-size:13px;font-weight:700;margin-bottom:6px}
.fu-q{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.fu-q .ql{font-size:12px;color:var(--sub);min-width:70px}
.opt{padding:4px 10px;border-radius:14px;border:1px solid var(--line);background:#FAFAF8;font-size:12px;cursor:pointer;user-select:none}
.opt.on{background:var(--blue);border-color:var(--blue);color:#fff}
.basics .fu-q .ql{min-width:110px}
.drug{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#FCFCFB}
.drug .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.drug .code{font-weight:800;font-size:15px;color:var(--sage-dark);font-family:ui-monospace,Menlo,monospace}
.drug .nm{font-weight:700;font-size:14px}
.drug .gn{font-size:12px;color:var(--sub)}
.drug .why{font-size:11px;color:var(--sage-dark);background:var(--sage-bg);border-radius:8px;padding:2px 8px;display:inline-block;margin-top:5px}
.drug.off{opacity:.45}
.drug select{margin-top:6px;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
.tgl{font-size:11px;color:var(--sub);cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:2px 8px;white-space:nowrap}
.alert{border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.alert.red{background:var(--rose-bg);color:#9B6A6A;border:1px solid #E3CDCD}
.alert.amber{background:var(--sand-bg);color:#A07F4F;border:1px solid #EADDC6}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:24px 0}
/* 處方表（仿 HIS 排列，一藥一行） */
.rxtab{width:100%;border-collapse:collapse;font-size:12px}
.rxtab th{text-align:left;color:var(--sub);font-weight:600;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rxtab td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.rxtab tr.off td{opacity:.4}
.rxtab .c-code{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:var(--sage-dark)}
.rxtab td.nmcell{white-space:normal}
.rxtab .c-nm{font-weight:700}
.rxtab .c-gn{font-size:11px;color:var(--sub);font-weight:400}
.rxtab .why{display:inline-block;font-size:10px;color:var(--sage-dark);background:var(--sage-bg);border-radius:6px;padding:1px 6px;margin-left:2px;font-weight:500}
.rxtab .num{text-align:right;font-variant-numeric:tabular-nums}
.rxtab .ctr{text-align:center}
.rxtab select{font-size:11px;padding:2px 4px;border:1px solid var(--line);border-radius:7px;background:#fff;max-width:160px}
.rxtab .daysin{width:40px;text-align:center;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px;font-variant-numeric:tabular-nums}
.rxtab .qtyin{width:54px;text-align:right;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px;font-variant-numeric:tabular-nums}
.rxtab .codesel{max-width:130px;font-weight:700;color:var(--sage-dark)}
.rxdel{cursor:pointer;color:var(--rose);font-weight:700;margin-left:5px;font-size:13px;padding:0 2px}
.rxdel:hover{color:#9B5A5A}
.rxtab .freqsel{font-size:11px}
.rxtab .tgl{font-size:10px}
/* 四燈號（第1234包：藍綠黃紅） */
.lights{display:inline-flex;gap:3px}
.lt{width:15px;height:15px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.12);background:#E2DDD5;transition:.12s}
.lt.on.blue{background:#6E8FB8}
.lt.on.green{background:#6E9B6E}
.lt.on.yellow{background:#D9B14A}
.lt.on.red{background:#C07A7A}
/* 處方標題列統計 */
.rxhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rxstat{display:inline-flex;align-items:center;gap:9px;font-weight:600}
.rxstat .stlbl{font-size:11px;color:var(--sub);font-weight:600}
.rxstat .st{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.rxstat .lt{cursor:default;width:13px;height:13px}
/* 頻率欄表頭的每包顆數 */
.rxtab .freqhead{vertical-align:bottom}
.fhstat{display:flex;align-items:center;gap:7px;margin-top:4px}
.fhstat .fhlbl{font-size:10px;color:var(--sub);font-weight:600}
.fhstat .st{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.fhstat .lt{width:11px;height:11px;cursor:default}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button.act{flex:1;min-width:110px;padding:10px;border:none;border-radius:10px;font-size:14px;cursor:pointer}
#copyCode{background:var(--sage);color:#fff}
#copyFull{background:var(--blue);color:#fff}
#resetBtn{background:#EDEAE5;color:var(--ink)}
footer{font-size:11px;color:var(--sub);text-align:center;margin-top:6px;line-height:1.6}
/* 規則編輯 modal */
#modal{position:fixed;inset:0;background:rgba(60,55,50,.45);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:10}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:20px;margin:auto}
.mbox h2{font-size:16px;margin-bottom:4px}
.mbox .hint{font-size:12px;color:var(--sub);margin-bottom:12px}
.rgroup{font-size:13px;font-weight:700;color:var(--sage-dark);margin:10px 0 0;padding:8px 6px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.rgroup .arr{font-size:10px;transition:.15s;color:var(--sub)}
.rgroup.open .arr{transform:rotate(90deg)}
.rgroup .cnt{font-size:11px;color:var(--sub);font-weight:400}
.rbody{display:none;padding-bottom:4px}
.rbody.open{display:block}
.rrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.rrow .rlabel{font-size:13px;min-width:150px}
.rdrug{display:inline-flex;align-items:center;gap:5px;background:var(--sage-bg);border-radius:10px;padding:3px 8px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.rdrug .lights{gap:2px}
.rdrug .lt{width:12px;height:12px}
.rdrug b{font-weight:700}
.rdrug .x{cursor:pointer;color:var(--rose);font-weight:700;padding:0 2px}
.rrow select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:#fff}
.mbtns{display:flex;gap:8px;margin-top:16px}
.mbtns button{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;cursor:pointer}
#mClose{background:var(--sage);color:#fff}
#mReset{background:#EDEAE5}
#mExport{background:var(--blue);color:#fff}
#mImport{background:#EDEAE5}
#impBox textarea{width:100%;height:120px;font-size:12px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px;box-sizing:border-box}
#impBox .impGo{margin-top:6px;padding:9px 16px;border:none;border-radius:8px;background:var(--sage);color:#fff;cursor:pointer;font-size:13px}
/* ============ 手機 RWD ============ */
#rx{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(max-width:600px){
 body{padding:10px}
 header{flex-wrap:wrap;gap:6px}
 header h1{font-size:17px}
 header .ver{flex:1 1 auto;font-size:11px;white-space:nowrap}
 .gear{padding:5px 10px;font-size:12px}
 .card{padding:12px;border-radius:12px}
 .chip{padding:9px 14px;font-size:14px} /* 加大觸控目標 */
 .sevhint{display:block;margin:4px 0 0}
 .rxtab{min-width:660px} /* 處方表橫向捲動，不擠壓 */
 .mbox{padding:14px;border-radius:12px}
 #modal{padding:10px}
 .rrow .rlabel{min-width:100%;padding-bottom:2px}
 .btnrow button.act{padding:12px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>減重開藥系統</h1><span class="ver">v1.0・減重輔助用藥・點色標嚴重度</span>
  <button class="gear" id="gearBtn">⚙️ 規則設定</button>
</header>
<!-- 上：主訴（追問展開在右邊） -->
<div class="card">
  <h2>主訴（可複選）<span class="sevhint">點一下 <span class="dot g"></span>普通・再點 <span class="dot r"></span>嚴重・第三下取消</span></h2>
  <div id="symChips"></div>
</div>

<!-- 下：處方 -->
<div class="card">
  <h2>處方</h2>
  <div id="rx"><div class="empty">勾選主訴後自動產生</div></div>
  <div class="btnrow">
    <button class="act" id="resetBtn">清除重來</button>
  </div>
</div>
<footer>本系統僅供臨床輔助參考，藥品、劑量與最終處方均以醫師專業判斷為準。</footer>
</div>

<!-- 規則編輯 -->
<div id="modal"><div class="mbox">
  <h2>規則設定（醫師經驗）</h2>
  <div class="hint">每條規則對應一或多個藥。點 ✕ 移除、下拉新增。改完自動存在這台電腦的瀏覽器，下次打開直接生效。</div>
  <div id="ruleList"></div>
  <div class="mbtns">
    <button id="mExport">匯出規則 JSON</button>
    <button id="mImport">匯入規則 JSON</button>
    <button id="mReset">恢復預設</button>
    <button id="mClose">完成</button>
  </div>
</div></div>

   ================================================================ */
const SYMPTOM_GROUPS=[
 {t:"主訴", items:[
   {id:"gibad",label:"胃不好"},

   {id:"vomit",label:"吐"},
 ]},
];
const SYMPTOMS=SYMPTOM_GROUPS.flatMap(g=>g.items);
const BASICS=[
 ["nsaidAllergy","NSAID過敏/潰瘍史",["無","有"]],
 ["htn","高血壓",["無","有"]],
 ["drive","開車/精密工作",["無","有"]],

/* ================================================================
   三、規則表（醫師經驗。介面「⚙️規則設定」可直接改藥，存於瀏覽器）
   每條：id、group、label、cond(s)、預設藥 rx:[院內代碼]
   ================================================================ */
/* 每個主訴都有 普通（綠）/ 嚴重（紅）兩條規則；rx 留空 = 暫不配藥，可在規則設定加 */
const R=(id,g,label,sym,lvl,rx)=>({id,g,label,cond:s=>s.sev(sym)===lvl,rx});
const RULE_DEFS=[
 R("gibad","主訴","胃不好普通（綠）","gibad","普通",["GAST2"]),
 R("gibad_sev","主訴","胃不好嚴重（紅）","gibad","嚴重",["OMEP1","GAST2"]),
 R("constip","主訴","便秘普通（綠）","constip","普通",["MGO"]),
 R("constip_sev","主訴","便秘嚴重（紅）","constip","嚴重",["MGO","DUL1"]),
 R("dizzy","主訴","頭暈普通（綠）","dizzy","普通",["BON2"]),
 R("dizzy_sev","主訴","頭暈嚴重（紅）","dizzy","嚴重",["BON2"]),
 R("nausea","主訴","噁心普通（綠）","nausea","普通",["MOT5"]),
 R("nausea_sev","主訴","噁心嚴重（紅）","nausea","嚴重",["MOT5"]),
 R("vomit","主訴","吐普通（綠）","vomit","普通",["MOT5"]),
 R("vomit_sev","主訴","吐嚴重（紅）","vomit","嚴重",["MOT5"]),
 {id:"nsaid_sub", g:"自動換藥", label:"NSAID過敏/潰瘍時改用", cond:()=>false, rx:["PANA"]},
];
const DOCTOR_RX={};
RULE_DEFS.forEach(r=>{if(DOCTOR_RX[r.id]!==undefined)r.rx=DOCTOR_RX[r.id]});
const DOCTOR_PK={};

/* 安全警示（固定邏輯） */
const WARNS=[
 s=>s.sev("cough")==="嚴重"?{level:"red",msg:"重度咳嗽：若病程超過 3 週建議胸部 X 光，排除肺炎、結核、腫瘤。"}:null,
 s=>s.sev("fever")==="嚴重"?{level:"red",msg:"高燒：若發燒 ≥3 天建議進一步檢查（CBC、流感/新冠快篩）。"}:null,
 s=>s.sev("throat")==="嚴重"?{level:"amber",msg:"重度喉痛：注意扁桃腺周圍膿瘍、會厭炎；化膿考慮加開抗生素。"}:null,
];

/* ================================================================
   四、引擎與畫面（一般不需修改）
   ================================================================ */
const LS_KEY="wrx_rules_v1";
let ruleRx={};   // {ruleId:[codes]} 醫師自訂
try{ruleRx=JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){ruleRx={}}
const getRx=r=>ruleRx[r.id]||r.rx;
/* 規則層級的頻率（四燈號＝第1234包），存瀏覽器 */
const LS_PK="wrx_rulepk_v1";
let rulePk={};   // {ruleId:{code:[bool,bool,bool,bool]}}
try{rulePk=JSON.parse(localStorage.getItem(LS_PK)||"{}")}catch(e){rulePk={}}
const getRulePk=(rid,code)=>{
 if(rulePk[rid]&&rulePk[rid][code])return rulePk[rid][code];
 if(DOCTOR_PK[rid]&&DOCTOR_PK[rid][code])return DOCTOR_PK[rid][code];
 return defaultPkts(parseDose((DRUGS[code]||{}).dose).freq);
};
const savePk=()=>localStorage.setItem(LS_PK,JSON.stringify(rulePk));

/* state.sym[id]: 0/undefined=未選, 1=普通(綠), 2=嚴重(紅) */
const state={sym:{},basic:{},excluded:{},removed:{},swap:{},days:{},qty:{},pkts:{}};
BASICS.forEach(([k,_,o])=>state.basic[k]=o[0]);
let currentRx=[];

const S={
 has:id=>!!state.sym[id],
 sev:id=>state.sym[id]===2?"嚴重":(state.sym[id]?"普通":""),
 basic:k=>state.basic[k]||"",
 rxCat:cat=>currentRx.some(r=>(DRUGS[r.code]||{}).cat===cat),
 anyRx:()=>currentRx.length>0,
};

function evaluate(){
 currentRx=[]; const warns=[]; const fired=[];
 for(const r of RULE_DEFS){
  if(r.id==="nsaid_sub") continue;
  let hit=false; try{hit=r.cond(S)}catch(e){}
  if(!hit) continue;
  fired.push(r);
  getRx(r).forEach(code=>{
   if(!DRUGS[code]) return;
   if(!currentRx.some(x=>x.code===code)){
    currentRx.push({code,why:r.g+"・"+r.label,rule:r.id});
    if(!state.pkts[code]) state.pkts[code]=getRulePk(r.id,code).slice(); // 帶入規則設定/醫師預設的頻率
   }
  });
 }
 // NSAID 強於 PANA：複選主訴各自帶入 NSAID 與 Acetaminophen 時，只留 NSAID
 // （例外：同一條規則本身就同時配了兩種 → 視為醫師刻意，兩者都留）
 const comboRule=fired.some(r=>{
  const cats=getRx(r).map(c=>(DRUGS[c]||{}).cat);
  return cats.includes("nsaid")&&cats.includes("acet");
 });
 if(!comboRule&&currentRx.some(x=>DRUGS[x.code].cat==="nsaid")&&currentRx.some(x=>DRUGS[x.code].cat==="acet")){
  currentRx=currentRx.filter(x=>DRUGS[x.code].cat!=="acet");
  warns.push({level:"amber",msg:"同時符合 NSAID 與 Acetaminophen：依 NSAID 強於 PANA 原則，僅保留 NSAID。"});
 }
 // NSAID 同包互斥：同一包不能有兩顆 NSAID（不同包可並存）
 // 衝突時依強弱 PONS2 > IBU > VOR50 > NIM1（未列入者視為最弱）留強去弱
 const NSTR=["PONS2","IBU","VOR50","NIM1"];
 const nrank=c=>{const i=NSTR.indexOf(c);return i<0?NSTR.length:i};
 const nsaids=currentRx.filter(x=>DRUGS[x.code].cat==="nsaid");
 if(nsaids.length>1){
  const kept=[],dropped=[];
  nsaids.slice().sort((a,b)=>nrank(a.code)-nrank(b.code)).forEach(x=>{
   const pk=rxFields(x.code).pk;
   const clash=kept.some(k=>rxFields(k.code).pk.some((on,i)=>on&&pk[i]));
   if(clash)dropped.push(x); else kept.push(x);
  });
  if(dropped.length){
   currentRx=currentRx.filter(x=>!dropped.includes(x));
   warns.push({level:"amber",msg:"同一包不可兩顆 NSAID：保留較強 "+kept.map(k=>k.code).join("、")+"，移除 "+dropped.map(d=>d.code).join("、")+"（強→弱：PONS2＞IBU＞VOR50＞NIM1）。"});
  }
 }
 // 抗生素 強取代弱：複選主訴各自帶入不同抗生素時只留最強的一種
 // （例外：同一條規則本身配了兩種抗生素 → 視為醫師刻意，都留）
 // 強→弱預設順序（可依醫師習慣調整）
 const ABX_STR=["LEV53","LEV2","AUG","CEFS","KEF2","DUR","CEPH1","ZIT2","KLAR2","VIBR","CLE1","BAKT2","FLA2","ILOS1","AMO52","AMO2"];
 const arank=c=>{const i=ABX_STR.indexOf(c);return i<0?ABX_STR.length:i};
 const comboAbx=fired.some(r=>getRx(r).filter(c=>(DRUGS[c]||{}).cat==="abx").length>=2);
 const abxList=currentRx.filter(x=>DRUGS[x.code].cat==="abx");
 if(!comboAbx&&abxList.length>1){
  const best=abxList.slice().sort((a,b)=>arank(a.code)-arank(b.code))[0];
  const dropA=abxList.filter(x=>x!==best);
  currentRx=currentRx.filter(x=>!dropA.includes(x));
  warns.push({level:"amber",msg:"多條規則帶入抗生素：依強取代弱原則保留 "+best.code+"，移除 "+dropA.map(d=>d.code).join("、")+"。"});
 }
 // NSAID 禁忌 → 換藥
 if(state.basic.nsaidAllergy==="有"&&currentRx.some(x=>DRUGS[x.code].cat==="nsaid")){
  const subs=getRx(RULE_DEFS.find(r=>r.id==="nsaid_sub"));
  currentRx=currentRx.filter(x=>DRUGS[x.code].cat!=="nsaid");
  currentRx=currentRx.filter(x=>x.rule!=="gi_protect");
  subs.forEach(code=>{if(!currentRx.some(x=>x.code===code)){
   currentRx.push({code,why:"NSAID禁忌替代",rule:"nsaid_sub"});
   if(!state.pkts[code]) state.pkts[code]=getRulePk("nsaid_sub",code).slice();
  }});
  warns.push({level:"amber",msg:"NSAID 過敏/潰瘍史：已移除 NSAID，改用替代止痛。"});
 }
 // 高血壓 → 移除鼻塞藥
 if(state.basic.htn==="有"&&currentRx.some(x=>DRUGS[x.code].cat==="dec")){
  currentRx=currentRx.filter(x=>DRUGS[x.code].cat!=="dec");
  warns.push({level:"amber",msg:"高血壓：已移除解鼻充血劑（麻黃鹼類），鼻塞可改生理食鹽水沖洗。"});
 }
 // 開車 → 一代抗組織胺改二代
 if(state.basic.drive==="有"){
  let swapped=false;
  currentRx=currentRx.map(x=>{
   if(DRUGS[x.code].cat==="ah1"){swapped=true;return{code:"LCETI3",why:"開車/精密工作改二代",rule:x.rule}}
   return x;
  }).filter((x,i,a)=>a.findIndex(y=>y.code===x.code)===i);
  if(swapped) warns.push({level:"amber",msg:"開車/精密工作：第一代抗組織胺已改為 Levocetirizine（仍可能輕微嗜睡）。"});
 }
 // 青光眼/攝護腺
 if(state.basic.bph==="有"&&currentRx.some(x=>["ah1","dec"].includes(DRUGS[x.code].cat))){
  warns.push({level:"amber",msg:"青光眼/攝護腺肥大：抗組織胺與鼻塞藥可能加重尿滯留/眼壓，請評估。"});
 }
 // 抗組織胺重複提醒
 if(currentRx.some(x=>x.code==="HIR0")&&currentRx.some(x=>["ah1","ah2"].includes(DRUGS[x.code].cat))){
  warns.push({level:"amber",msg:"HIR0 已含 Cetirizine，與另一抗組織胺重複，請擇一。"});
 }
 // Codeine 提醒
 if(currentRx.some(x=>x.code==="COD1"||x.code==="COD2")){
  warns.push({level:"amber",msg:"含 Codeine：嗜睡、便祕，避免與酒精併用；勿用於呼吸抑制風險者。"});
 }
 // 展望/外部帶入的處方（原樣加入，不套強弱取代）
 (state.manual||[]).forEach(code=>{
  if(DRUGS[code]&&!currentRx.some(x=>x.code===code)) currentRx.push({code,why:"前次處方帶入",rule:"manual"});
 });
 // 固定紅旗
 WARNS.forEach(f=>{const w=f(S); if(w)warns.push(w)});
 renderRx(warns);
}

function render(){
 const chips=document.getElementById("symChips"); chips.innerHTML="";
 SYMPTOM_GROUPS.forEach(g=>{
  const gd=document.createElement("div"); gd.className="symgroup";
  gd.innerHTML=`<div class="gt">${g.t}</div>`;
  const cw=document.createElement("div"); cw.className="chips";
  g.items.forEach(s=>{
   const lvl=state.sym[s.id]||0;
   const c=document.createElement("span");
   c.className="chip"+(lvl===1?" on":lvl===2?" sev":""); c.textContent=s.label;
   c.title=lvl===0?"點一下：普通":lvl===1?"再點：嚴重":"再點：取消";
   c.onclick=()=>{
    if(lvl===2) delete state.sym[s.id]; else state.sym[s.id]=lvl+1; // 未選→綠(普通)→紅(嚴重)→未選…
    render();
   };
   cw.appendChild(c);
  });
  gd.appendChild(cw); chips.appendChild(gd);
 });
 evaluate();
}
function drugSelect(cat,cur,onchange){
 const sel=document.createElement("select");
 Object.entries(DRUGS).filter(([c,d])=>d.cat===cat).forEach(([c,d])=>{
  const o=document.createElement("option"); o.value=c; o.textContent=`${c}｜${d.zh}（${d.gn}）`;
  if(c===cur)o.selected=true; sel.appendChild(o);
 });
 sel.onchange=()=>onchange(sel.value);
 return sel;
}
/* ---- 把 dose 字串解析成 HIS 欄位 ---- */
const DEFAULT_DAYS=3;
const FREQ_PER_DAY={QD:1,BID:2,TID:3,QID:4,HS:1};
function parseDose(dose){
 dose=dose||"";
 let qty=1,un="錠";
 const ml=dose.match(/([\d.]+)\s*ml/i), hash=dose.match(/([\d.]+)#/);
 if(ml){qty=parseFloat(ml[1]);un="ML";}
 else if(hash){qty=parseFloat(hash[1]);un="錠";}
 let freq=""; const fm=dose.match(/\b(QID|TID|BID|QD)\b/);
 if(fm)freq=fm[1]; else if(/HS/.test(dose))freq="HS";
 let days=DEFAULT_DAYS; const dm=dose.match(/[×x]\s*(\d+)\s*天/); if(dm)days=parseInt(dm[1]);
 const notes=[];
 if(/PRN/.test(dose))notes.push("PRN");
 if(/\bPC\b/.test(dose))notes.push("PC");
 if(/\bAC\b/.test(dose))notes.push("AC");
 if(/HS/.test(dose)&&freq!=="HS")notes.push("HS");
 if(/空腹/.test(dose))notes.push("空腹");
 return {qty,un,freq,days,note:notes.join(" ")};
}
function rxTotal(p,days){return +(p.qty*(FREQ_PER_DAY[p.freq]||1)*days).toFixed(1);}
/* 四燈號＝藥包第1234包；亮的數量＝一天幾包 */
function defaultPkts(freq){
 if(freq==="HS")return[false,false,false,true];
 const n=FREQ_PER_DAY[freq]||1;
 return [n>=1,n>=2,n>=3,n>=4];
}
function rxPkts(code){
 if(!state.pkts[code]) state.pkts[code]=defaultPkts(parseDose(DRUGS[code].dose).freq);
 return state.pkts[code];
}
function freqCode(pk){
 const n=pk.filter(Boolean).length;
 if(n===1&&pk[3]&&!pk[0]&&!pk[1]&&!pk[2])return"HS";
 return {0:"",1:"QD",2:"BID",3:"TID",4:"QID"}[n]||"";
}
/* 套用醫師在表格上的覆寫（劑量／包別／日） */
function rxFields(code){
 const p=parseDose(DRUGS[code].dose);
 const qty=state.qty[code]!=null?state.qty[code]:p.qty;
 const days=state.days[code]!=null?state.days[code]:p.days;
 const pk=rxPkts(code);
 const perDay=pk.filter(Boolean).length;
 const total=+(qty*perDay*days).toFixed(1);
 return {qty,un:p.un,pk,perDay,days,total,note:p.note};
}
function codeSelect(cat,cur,onchange){
 const sel=document.createElement("select"); sel.className="codesel";
 Object.entries(DRUGS).filter(([c,d])=>d.cat===cat).forEach(([c,d])=>{
  const o=document.createElement("option"); o.value=c; o.textContent=c;
  if(c===cur)o.selected=true; sel.appendChild(o);
 });
 sel.onchange=()=>onchange(sel.value);
 return sel;
}

function renderRx(warns){
 const al=document.getElementById("alerts");
 if(al){
  al.innerHTML=warns.length?"":'<div class="empty">無</div>';
  warns.forEach(w=>{
   const d=document.createElement("div"); d.className="alert "+(w.level==="red"?"red":"amber");
   d.textContent=(w.level==="red"?"🚩 ":"⚠️ ")+w.msg; al.appendChild(d);
  });
 }
 const rx=document.getElementById("rx");
 if(!currentRx.length){rx.innerHTML='<div class="empty">勾選主訴後自動產生</div>';return}
 rx.innerHTML="";
 const st=computeStat(); const scol=["blue","green","yellow","red"];
 const statHtml=st.any?'<div class="fhstat"><span class="fhlbl">每包顆數</span>'+
  st.sums.map((s,i)=>`<span class="st"><span class="lt on ${scol[i]}"></span>${+s.toFixed(2)}</span>`).join("")+'</div>':'';
 const tab=document.createElement("table"); tab.className="rxtab";
 tab.innerHTML='<thead><tr><th>藥代</th><th>全名</th><th class="num">次劑量</th><th>UN</th>'+
  '<th class="freqhead">頻率'+statHtml+'</th><th class="ctr">日</th><th class="num">總量</th><th>途徑</th><th>註</th><th></th></tr></thead>';
 const tb=document.createElement("tbody");
 /* 處方排列順序：抗生素→類固醇→NSAID→止痛→胃藥/腸胃→止咳→化痰→擴張劑→鼻塞→長效(二代)抗組織胺→短效(一代)抗組織胺 */
 const CAT_ORDER={abx:0,ster:1,nsaid:2,acet:3,gi:4,tuss:5,muco:6,bron:7,dec:8,ah2:9,ah1:10};
 const catOf=it=>(DRUGS[state.swap[it.rule+"_"+it.code]||it.code]||{}).cat;
 const sorted=[...currentRx].sort((a,b)=>(CAT_ORDER[catOf(a)]??99)-(CAT_ORDER[catOf(b)]??99));
 sorted.forEach(item=>{
  const code=state.swap[item.rule+"_"+item.code]||item.code;
  const d=DRUGS[code]; if(!d||state.removed[code])return;
  const off=state.excluded[code];
  const f=rxFields(code);
  const tr=document.createElement("tr"); if(off)tr.className="off";
  tr.innerHTML=
   `<td class="codecell"></td>`+
   `<td class="nmcell"><span class="c-nm">${d.gn}</span></td>`+
   `<td class="num qtycell"></td>`+
   `<td>${f.un}</td>`+
   `<td class="freqcell"></td>`+
   `<td class="ctr"></td>`+
   `<td class="num">${f.total.toFixed(1)}</td>`+
   `<td>PO</td>`+
   `<td>${f.note||""}</td>`+
   `<td></td>`;
  // 藥代：點選換藥＋✕刪除
  tr.children[0].appendChild(codeSelect(d.cat,code,v=>{state.swap[item.rule+"_"+item.code]=v;renderRx(warns)}));
  const del=document.createElement("span"); del.className="rxdel"; del.textContent="✕"; del.title="刪除此藥";
  del.onclick=()=>{state.removed[code]=true;renderRx(warns)};
  tr.children[0].appendChild(del);
  // 次劑量：可改
  const qin=document.createElement("input"); qin.className="qtyin"; qin.type="number"; qin.step="0.25"; qin.min="0"; qin.value=f.qty;
  qin.onchange=()=>{state.qty[code]=parseFloat(qin.value)||0;renderRx(warns)};
  tr.children[2].appendChild(qin);
  // 頻率：四燈號（藍綠黃紅＝第1234包），可點亮暗
  const lw=document.createElement("div"); lw.className="lights"; const cols=["blue","green","yellow","red"];
  f.pk.forEach((on,i)=>{
   const dot=document.createElement("span"); dot.className="lt "+cols[i]+(on?" on":""); dot.title="第"+(i+1)+"包";
   dot.onclick=()=>{const a=rxPkts(code).slice();a[i]=!a[i];state.pkts[code]=a;renderRx(warns);};
   lw.appendChild(dot);
  });
  tr.children[4].appendChild(lw);
  // 日：可改
  const din=document.createElement("input"); din.className="daysin"; din.type="number"; din.min="1"; din.value=f.days;
  din.onchange=()=>{state.days[code]=parseInt(din.value)||1;renderRx(warns)};
  tr.children[5].appendChild(din);
  // 排除
  const t=document.createElement("span"); t.className="tgl"; t.textContent=off?"已排除":"排除";
  t.onclick=()=>{state.excluded[code]=!state.excluded[code];renderRx(warns)};
  tr.children[9].appendChild(t);
  tb.appendChild(tr);
 });
 tab.appendChild(tb); rx.appendChild(tab);
}
/* 每包顆數統計（第1234包；只計錠劑） */
function computeStat(){
 const sums=[0,0,0,0]; let any=false;
 currentRx.forEach(item=>{
  const code=state.swap[item.rule+"_"+item.code]||item.code;
  if(!DRUGS[code]||state.excluded[code]||state.removed[code])return;
  const f=rxFields(code); if(f.un!=="錠")return;
  any=true; f.pk.forEach((on,i)=>{if(on)sums[i]+=f.qty;});
 });
 return {sums,any};
}
function finalList(){
 const seen={};
 return currentRx.map(i=>state.swap[i.rule+"_"+i.code]||i.code)
  .filter(c=>!state.excluded[c]&&!state.removed[c]&&!seen[c]&&(seen[c]=1));
}
function flash(id,a,b){const e=document.getElementById(id);e.textContent=a;setTimeout(()=>e.textContent=b,1200)}
document.getElementById("resetBtn").onclick=()=>{
 state.sym={};state.excluded={};state.removed={};state.swap={};state.days={};state.qty={};state.pkts={};state.manual=[];
 BASICS.forEach(([k,_,o])=>state.basic[k]=o[0]);
 render();
};

/* ---------- 規則編輯 ---------- */
const modal=document.getElementById("modal");
document.getElementById("gearBtn").onclick=()=>{renderRules();modal.classList.add("show")};
document.getElementById("mClose").onclick=()=>{modal.classList.remove("show");render()};
document.getElementById("mReset").onclick=()=>{
 if(confirm("確定恢復所有規則為預設值？")){ruleRx={};rulePk={};localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_PK);renderRules()}
};
document.getElementById("mExport").onclick=()=>{
 const full={}; RULE_DEFS.forEach(r=>full[r.id]=getRx(r));
 navigator.clipboard.writeText(JSON.stringify({rx:full,pkts:rulePk},null,1)).then(()=>flash("mExport","已複製 ✓","匯出規則 JSON"));
};
document.getElementById("mImport").onclick=()=>{
 let box=document.getElementById("impBox");
 if(box){box.remove();return}
 box=document.createElement("div"); box.id="impBox";
 const ta=document.createElement("textarea"); ta.placeholder="貼上另一台裝置「匯出規則 JSON」的內容，按確定匯入（會覆蓋此裝置的規則與頻率設定）";
 const go=document.createElement("button"); go.className="impGo"; go.textContent="確定匯入";
 go.onclick=()=>{
  try{
   const o=JSON.parse(ta.value);
   if(o&&(o.rx||o.pkts)){ruleRx=o.rx||{};rulePk=o.pkts||{};}
   else if(o&&typeof o==="object"){ruleRx=o;}
   else throw new Error("內容不是規則 JSON");
   saveRules();savePk();box.remove();renderRules();
  }catch(e){alert("匯入失敗："+e.message)}
 };
 box.appendChild(ta);box.appendChild(go);
 document.getElementById("ruleList").after(box);
};
function saveRules(){localStorage.setItem(LS_KEY,JSON.stringify(ruleRx))}
const openGroups={}; // 收折狀態（點群組標題展開）
function renderRules(){
 const box=document.getElementById("ruleList"); box.innerHTML="";
 let lastG="",body=null;
 RULE_DEFS.forEach(r=>{
  if(r.g!==lastG){
   lastG=r.g; const g=r.g, open=!!openGroups[g];
   const n=RULE_DEFS.filter(x=>x.g===g).length, filled=RULE_DEFS.filter(x=>x.g===g&&getRx(x).length).length;
   const h=document.createElement("div"); h.className="rgroup"+(open?" open":"");
   h.innerHTML=`<span class="arr">▶</span>${g}<span class="cnt">${filled}/${n} 已配藥</span>`;
   h.onclick=()=>{openGroups[g]=!openGroups[g];renderRules()};
   box.appendChild(h);
   body=document.createElement("div"); body.className="rbody"+(open?" open":"");
   box.appendChild(body);
  }
  const row=document.createElement("div"); row.className="rrow";
  const lab=document.createElement("span"); lab.className="rlabel"; lab.textContent=r.label; row.appendChild(lab);
  getRx(r).forEach((code,idx)=>{
   const tag=document.createElement("span"); tag.className="rdrug";
   const b=document.createElement("b"); b.textContent=code; tag.appendChild(b);
   // 四燈號：點選改此規則出藥的預設頻率（第1234包）
   const lw=document.createElement("span"); lw.className="lights";
   const pk=getRulePk(r.id,code); const cols=["blue","green","yellow","red"];
   pk.forEach((on,i)=>{
    const dot=document.createElement("span"); dot.className="lt "+cols[i]+(on?" on":""); dot.title="第"+(i+1)+"包";
    dot.onclick=()=>{
     const a=getRulePk(r.id,code).slice(); a[i]=!a[i];
     rulePk[r.id]=rulePk[r.id]||{}; rulePk[r.id][code]=a; savePk(); renderRules();
    };
    lw.appendChild(dot);
   });
   tag.appendChild(lw);
   const x=document.createElement("span"); x.className="x"; x.textContent="✕";
   x.onclick=()=>{
    const arr=[...getRx(r)]; arr.splice(idx,1); ruleRx[r.id]=arr; saveRules();
    if(rulePk[r.id]){delete rulePk[r.id][code]; savePk();}
    renderRules();
   };
   tag.appendChild(x);
   row.appendChild(tag);
  });
  const sel=document.createElement("select");
  sel.innerHTML='<option value="">＋加藥…</option>';
  let lastCat="";
  Object.entries(DRUGS).forEach(([c,d])=>{
   if(d.cat!==lastCat){lastCat=d.cat;const og=document.createElement("optgroup");og.label=CAT_LABEL[d.cat];sel.appendChild(og)}
   const o=document.createElement("option"); o.value=c; o.textContent=`${c}｜${d.gn}`;
   sel.lastChild.appendChild(o);
  });
  sel.onchange=()=>{
   if(!sel.value)return;
   const arr=[...getRx(r)]; if(!arr.includes(sel.value))arr.push(sel.value);
   ruleRx[r.id]=arr; saveRules(); renderRules();
  };
  row.appendChild(sel);
  body.appendChild(row);
 });
}
/* ---------- 病人資訊（#pt=姓名|病歷號|註記，fragment 不會送到伺服器） ---------- */
(function(){
 const m=(location.hash||"").match(/pt=([^&]+)/);
 if(!m)return;
 const parts=decodeURIComponent(m[1]).split("|");
 const nm=parts[0]||"",sn=parts[1]||"",note=parts[2]||"";
 if(!nm&&!sn)return;
 const bar=document.createElement("div"); bar.className="ptbar";
 bar.textContent="👤 "+nm+(sn?"（"+sn+"）":"")+(note?"・⚠️ "+note:"");
 const wrap=document.querySelector(".wrap"), hd=document.querySelector("header");
 wrap.insertBefore(bar,hd.nextSibling);
})();
/* ---------- 網址帶入處方 ?rx=藥代:次劑量:頻率:日,... 例 ?rx=AMO52:1:QID:3,AMB:1:TID:3 ---------- */
(function(){
 const p=new URLSearchParams(location.search).get("rx");
 if(!p)return;
 state.manual=[];
 p.split(",").forEach(t=>{
  const [code,qty,freq,days]=t.trim().split(":");
  const c=(code||"").toUpperCase();
  if(!DRUGS[c])return;
  state.manual.push(c);
  if(qty)state.qty[c]=parseFloat(qty)||1;
  if(days)state.days[c]=parseInt(days)||DEFAULT_DAYS;
  if(freq)state.pkts[c]=defaultPkts(freq.toUpperCase());
 });
})();
render();
</script>
